<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Đặt lại mật khẩu - NexTech</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f3f5fa; color: #1a234a; font: 16px/1.5 Arial, sans-serif; }
      main { width: 100%; max-width: 440px; padding: 32px; background: white; border-radius: 18px; box-shadow: 0 12px 40px #1a234a14; }
      img { width: 160px; max-width: 100%; }
      h1 { font-size: 25px; margin-bottom: 10px; }
      p { color: #596078; }
      label { display: block; margin-top: 20px; font-weight: bold; }
      input { display: block; width: 100%; padding: 13px; margin-top: 7px; border: 1px solid #b6bdcf; border-radius: 8px; font: inherit; }
      input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid #7c9df5; outline-offset: 3px; }
      button { width: 100%; margin-top: 24px; padding: 14px; background: #244ec5; color: white; border: none; border-radius: 8px; font: inherit; font-weight: bold; cursor: pointer; }
      button:disabled { opacity: .6; cursor: default; }
      #resetMessage { min-height: 24px; color: #344267; overflow-wrap: anywhere; }
      a { color: #244ec5; }
    </style>
  </head>
  <body>
    <main>
      <a href="index.html"><img src="../assets/img/LOGO.png" alt="NexTech - Trang chủ" /></a>
      <h1>Đặt lại mật khẩu</h1>
      <p>Chọn mật khẩu mới. Liên kết trong email có hiệu lực 15 phút và chỉ dùng một lần.</p>
      <form id="resetPasswordForm">
        <label for="newPassword">Mật khẩu mới</label>
        <input id="newPassword" type="password" autocomplete="new-password" minlength="6" maxlength="72" required aria-describedby="passwordHelp" />
        <small id="passwordHelp">Tối thiểu 6 ký tự, tối đa 72 byte UTF-8.</small>
        <label for="confirmPassword">Nhập lại mật khẩu mới</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" maxlength="72" required />
        <button id="resetPasswordButton" type="submit">Lưu mật khẩu mới</button>
      </form>
      <p id="resetMessage" role="status" aria-live="polite"></p>
      <a href="login.html">Quay lại đăng nhập</a>
    </main>
    <script src="../scripts/api-config.js"></script>
    <script src="../scripts/reset-password.js"></script>
  </body>
</html>
