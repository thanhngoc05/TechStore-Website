name: Backend tests

on:
  push:
    paths: ['backend/**', 'scripts/**', 'pages/order-information.html', 'tests/**', '.github/workflows/backend-tests.yml']
  pull_request:
    paths: ['backend/**', 'scripts/**', 'pages/order-information.html', 'tests/**', '.github/workflows/backend-tests.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/payment-return.test.cjs tests/order-detail.test.cjs tests/product-reviews.test.cjs
