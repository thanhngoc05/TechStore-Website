name: Backend tests

on:
  push:
    paths: ['backend/**', 'scripts/**', 'pages/**', 'assets/**', 'tests/**', '.github/workflows/backend-tests.yml']
  pull_request:
    paths: ['backend/**', 'scripts/**', 'pages/**', 'assets/**', 'tests/**', '.github/workflows/backend-tests.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/payment-return.test.cjs tests/order-detail.test.cjs tests/product-reviews.test.cjs tests/refund-form.test.cjs tests/order-lookup.test.cjs tests/reset-password.test.cjs tests/profile-session.test.cjs tests/admin-refunds.test.cjs tests/customer-refunds.test.cjs

  mysql-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-root-password
          MYSQL_DATABASE: techstore_test
          MYSQL_USER: techstore_test
          MYSQL_PASSWORD: ephemeral-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      TECHSTORE_TEST_DATABASE_URI: mysql+pymysql://techstore_test:ephemeral-test-password@127.0.0.1:3306/techstore_test
      TECHSTORE_ALLOW_DATABASE_RESET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: python -m unittest discover -s tests -v
